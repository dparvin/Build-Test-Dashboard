$kind: http-request
method: POST
url: '{{baseUrl}}/api/repositories'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "repository": {
        "name": "My Repo",
        "provider": "GitHub",
        "owner": "my-org",
        "project": "",
        "repositoryName": "my-repo"
      },
      "credential": {
        "authenticationType": "Token",
        "secret": "ghp_exampletoken"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200, 401, or 404", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 401, 404, 502]);
      });

      if (pm.response.code === 200) {
          pm.test("Response has id field", function () {
              const body = pm.response.json();
              pm.expect(body).to.have.property("id");
          });

          pm.test("Response has provider field", function () {
              const body = pm.response.json();
              pm.expect(body).to.have.property("provider");
          });
      }

      pm.test("Response time is under 5000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
